---
# tasks file for vps_nginx
- name: Install nginx
  apt:
    name: 
      - nginx
      - libnginx-mod-stream
    state: present
    update_cache: yes


- name: Template nginx.conf
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  notify: reload nginx

- name: Nginx enable
  service:
    name: nginx
    state: started
    enabled: yes

