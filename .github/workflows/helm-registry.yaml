name: Private registry charts

on:
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Run helm lint
        run: helm lint charts/minecraft

      - name: Login Harbor
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASS }}
        run: |
          echo "$HARBOR_PASS" | helm registry login 192.168.0.211 -u $HARBOR_USER --password-stdin
      
      - name: Package and push Charts to the Repository 
        run: |
          CHART_TAG=$(helm package charts/minecraft -d /tmp | awk '{print $NF}')
          helm push $CHART_TAG oci://192.168.0.211/helm-homelab
          rm -rf CHART_TAG