name: Private registry charts

on:
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Run helm lint
        run: helm lint charts/minecraft

      - name: Login Harbor
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASS }}
        run: |
          echo "$HARBOR_PASS" | helm registry login 192.168.0.211 -u $HARBOR_USER --password-stdin

      - name: Package Charts
        run:
          helm package charts/minecraft
      
      - name: Push Charts to the Repository 
        run:
          helm push minecraft-$(grep "version:" charts/minecraft/Chart.yaml | awk '{print $2}').tgz  oci://192.168.0.211/helm-homelab