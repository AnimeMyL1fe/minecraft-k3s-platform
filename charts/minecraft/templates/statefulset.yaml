apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-statefulset
  labels:
    app: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  serviceName: {{ .Release.Name }}-service
  replicas: 1
  minReadySeconds: 0
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: {{ .Release.Name }}
        image: itzg/minecraft-server
        env:
        - name: EULA
          value: "TRUE"
        - name: ONLINE_MODE
          value: "FALSE"
        ports:
        - containerPort: 25565
          name: default-port
        resources:
          requests:
            cpu: {{ .Values.resRequest.cpu }}
            memory: {{ .Values.resRequest.mem }}
          limits:
            cpu: {{ .Values.resLimit.cpu }}
            memory: {{ .Values.resLimit.mem }}
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "local-path"
      resources:
        requests:
          storage: 3Gi
